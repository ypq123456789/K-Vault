name = "k-vault"
main = "src/worker.js"
compatibility_date = "2026-05-16"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "img_url"
id = "5fe31f18133246fab97ea71a962eea59"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "k-vault-files"

[vars]
NODE_ENV = "production"
PORT = "8787"
PUBLIC_BASE_URL = ""
BASIC_USER = "admin"
BASIC_PASS = ""
SESSION_COOKIE_NAME = "k_vault_session"
SESSION_DURATION_MS = "86400000"
CONFIG_ENCRYPTION_KEY = ""
SESSION_SECRET = ""
GUEST_UPLOAD = "false"
GUEST_MAX_FILE_SIZE = "5242880"
GUEST_DAILY_LIMIT = "10"
UPLOAD_MAX_SIZE = "104857600"
UPLOAD_SMALL_FILE_THRESHOLD = "20971520"
CHUNK_SIZE = "5242880"
DATA_DIR = "/app/data"
DB_PATH = "/app/data/k-vault.db"
CHUNK_DIR = "/app/data/chunks"
SETTINGS_STORE = "sqlite"
SETTINGS_REDIS_URL = ""
SETTINGS_REDIS_PREFIX = "k-vault"
SETTINGS_REDIS_CONNECT_TIMEOUT_MS = "5000"
DEFAULT_STORAGE_TYPE = "r2"
TG_BOT_TOKEN = ""
TG_CHAT_ID = ""
TG_Chat_ID = "-1003931055505"
"TG_Chat_ID " = "-1003931055505"
CUSTOM_BOT_API_URL = "https://api.telegram.org"
R2_ENDPOINT = ""
R2_REGION = "auto"
R2_ACCESS_KEY_ID = ""
R2_SECRET_ACCESS_KEY = ""
S3_ENDPOINT = ""
S3_REGION = "us-east-1"
S3_BUCKET = ""
S3_ACCESS_KEY_ID = ""
S3_SECRET_ACCESS_KEY = ""
DISCORD_WEBHOOK_URL = ""
DISCORD_BOT_TOKEN = ""
DISCORD_CHANNEL_ID = ""
HF_TOKEN = ""
HF_REPO = ""
WEBDAV_BASE_URL = ""
WEBDAV_USERNAME = ""
WEBDAV_PASSWORD = ""
WEBDAV_BEARER_TOKEN = ""
WEBDAV_ROOT_PATH = ""
GITHUB_REPO = ""
GITHUB_TOKEN = ""
GITHUB_MODE = "releases"
GITHUB_PREFIX = ""
GITHUB_RELEASE_TAG = ""
GITHUB_BRANCH = ""
GITHUB_API_BASE = "https://api.github.com"
METADATA_R2_FALLBACK_READ = "true"
METADATA_R2_LAZY_MIGRATE = "true"
METADATA_R2_PREFIX = "kv/"
METADATA_STORE = "r2"
MINIMIZE_KV_WRITES = "true"
TELEGRAM_LINK_MODE = "signed"
TG_UPLOAD_NOTIFY = "true"
