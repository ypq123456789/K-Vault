name = "k-vault"
main = "src/worker.js"
compatibility_date = "2026-05-16"
workers_dev = true

[[routes]]
pattern = "image1.bacon159.pp.ua/*"
zone_name = "bacon159.pp.ua"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "img_url"
id = "5fe31f18133246fab97ea71a962eea59"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "k-vault-files"

[vars]
BASIC_USER = "bacon"
DEFAULT_STORAGE_TYPE = "r2"
GITHUB_MODE = "releases"
GITHUB_REPO = "ypq123456789/kvault-files"
METADATA_R2_FALLBACK_READ = "true"
METADATA_R2_LAZY_MIGRATE = "false"
METADATA_R2_PREFIX = "kv/"
METADATA_STORE = "r2"
MINIMIZE_KV_WRITES = "true"
S3_BUCKET = "hi168-19275-07130td3"
S3_ENDPOINT = "https://s3.hi168.com"
S3_REGION = "us-east-1"
TELEGRAM_LINK_MODE = "signed"
TG_Chat_ID = "-1003931055505"
"TG_Chat_ID " = "-1003931055505"
TG_UPLOAD_NOTIFY = "true"
